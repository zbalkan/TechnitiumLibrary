name: Validate BUG-02 compatibility

on:
  push:
    branches: [ "validation/bug02-compatibility" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Run BUG-02 compatibility checks
        run: dotnet run --project tests/Bug02Compatibility/Bug02Compatibility.csproj -c Release
