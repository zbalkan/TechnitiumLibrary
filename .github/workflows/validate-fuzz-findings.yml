name: Validate archived DNS findings after upstream RDLENGTH fix

on:
  push:
    branches:
      - validation/fuzz-findings-post-rdlength
    paths:
      - "tests/repros/**"
      - "TechnitiumLibrary.Net/Dns/**"
      - ".github/workflows/validate-fuzz-findings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Build specialized parser harness
        run: dotnet publish fuzzing/coverage/DnsParserFuzz/DnsParserFuzz.csproj -c Release -o "${RUNNER_TEMP}/parser"

      - name: Build direct label round-trip probe
        run: dotnet publish tests/repros/bug02/NameRoundTrip.csproj -c Release -o "${RUNNER_TEMP}/name-probe"

      - name: Run all five archived reproducers against patched RDATA parser
        run: |
          ulimit -c 0
          python3 tests/repros/validate_post_rdlength.py \
            --parser-dll "${RUNNER_TEMP}/parser/DnsParserFuzz.dll" \
            --name-dll "${RUNNER_TEMP}/name-probe/NameRoundTrip.dll" \
            --output "${RUNNER_TEMP}/finding-validation"

      - name: Upload inputs and verdict evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-rdlength-finding-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/finding-validation/
          retention-days: 30
          if-no-files-found: error
