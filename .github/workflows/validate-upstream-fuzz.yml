name: Verify fuzz findings against pinned upstream develop

on:
  push:
    branches:
      - validation/fuzz-findings-post-rdlength
    paths:
      - ".github/workflows/validate-upstream-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TechnitiumSoftware/TechnitiumLibrary
          ref: 920234c498e6dbba6150ee1b372b416eff4b0d9e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Attach test-only harnesses to unmodified upstream source
        run: |
          mkdir -p upstream/fuzzing/coverage upstream/tests/repros
          cp -a validation/fuzzing/coverage/DnsParserFuzz upstream/fuzzing/coverage/
          cp -a validation/tests/repros/bug02 upstream/tests/repros/

      - name: Build harness against actual upstream develop
        run: dotnet publish upstream/fuzzing/coverage/DnsParserFuzz/DnsParserFuzz.csproj -c Release -o "${RUNNER_TEMP}/parser-upstream"

      - name: Build label-roundtrip probe against actual upstream develop
        run: dotnet publish upstream/tests/repros/bug02/NameRoundTrip.csproj -c Release -o "${RUNNER_TEMP}/name-probe-upstream"

      - name: Validate all five findings without treating changed signatures as fixes
        working-directory: validation
        run: |
          ulimit -c 0
          python3 tests/repros/validate_post_rdlength.py \
            --parser-dll "${RUNNER_TEMP}/parser-upstream/DnsParserFuzz.dll" \
            --name-dll "${RUNNER_TEMP}/name-probe-upstream/NameRoundTrip.dll" \
            --output "${RUNNER_TEMP}/upstream-findings"

      - name: Archive exact upstream results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-develop-finding-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-findings/
          retention-days: 30
          if-no-files-found: error
