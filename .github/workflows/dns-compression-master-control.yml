name: Confirm compression behavior in original master

on:
  push:
    branches: [ "validation/bug02-master-compression-control" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Confirm master DNS compression corruption
        run: dotnet run --project tests/DnsCompressionMasterControl/DnsCompressionMasterControl.csproj -c Release
