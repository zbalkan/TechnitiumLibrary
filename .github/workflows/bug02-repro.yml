name: BUG-02 DNS label round-trip reproduction
on:
  push:
    branches: [ "test/bug-02-label-roundtrip" ]
    paths: [ "tests/repros/bug02/**", ".github/workflows/bug02-repro.yml" ]
  pull_request:
    paths: [ "tests/repros/bug02/**", ".github/workflows/bug02-repro.yml" ]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Build direct library name round-trip probe
        run: dotnet publish tests/repros/bug02/NameRoundTrip.csproj -c Release -o "${RUNNER_TEMP}/bug02-probe"
      - name: Generate a literal-period wire label and check reversibility
        run: python3 tests/repros/bug02/reproduce.py --dll "${RUNNER_TEMP}/bug02-probe/NameRoundTrip.dll" --output "${RUNNER_TEMP}/bug02-evidence"
      - name: Archive exact payloads and round-trip differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bug02-reproduction-${{ github.run_id }}
          path: ${{ runner.temp }}/bug02-evidence/
          retention-days: 30
          if-no-files-found: error
