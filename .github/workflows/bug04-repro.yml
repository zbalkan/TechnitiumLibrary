name: BUG-04 deterministic reproduction
on:
  push:
    branches: [ "test/bug-04-serialization-reparse" ]
    paths: [ "tests/repros/bug04/**", ".github/workflows/bug04-repro.yml" ]
  pull_request:
    paths: [ "tests/repros/bug04/**", ".github/workflows/bug04-repro.yml" ]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Build clean (uninstrumented) parser harness
        run: dotnet publish fuzzing/coverage/DnsParserFuzz/DnsParserFuzz.csproj -c Release -o "${RUNNER_TEMP}/parser-clean"
      - name: Generate inputs and verify recorded failure signatures
        run: |
          ulimit -c 0
          python3 tests/repros/bug04/reproduce.py --dll "${RUNNER_TEMP}/parser-clean/DnsParserFuzz.dll" --output "${RUNNER_TEMP}/bug04-evidence"
      - name: Archive exact inputs and clean-harness output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bug04-reproduction-${{ github.run_id }}
          path: ${{ runner.temp }}/bug04-evidence/
          retention-days: 30
          if-no-files-found: error
