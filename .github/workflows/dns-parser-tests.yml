name: DNS parser tests

on:
  push:
    branches: [ "**" ]
    paths:
      - "TechnitiumLibrary/**"
      - "TechnitiumLibrary.IO/**"
      - "TechnitiumLibrary.Net/**"
      - "TechnitiumLibrary.Net.Tests/**"
      - ".github/workflows/dns-parser-tests.yml"
  pull_request:
    paths:
      - "TechnitiumLibrary/**"
      - "TechnitiumLibrary.IO/**"
      - "TechnitiumLibrary.Net/**"
      - "TechnitiumLibrary.Net.Tests/**"
      - ".github/workflows/dns-parser-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TechnitiumLibrary.Net.Tests/TechnitiumLibrary.Net.Tests.csproj

      - name: Build
        run: dotnet build --no-restore --configuration Release TechnitiumLibrary.Net.Tests/TechnitiumLibrary.Net.Tests.csproj

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          TechnitiumLibrary.Net.Tests/TechnitiumLibrary.Net.Tests.csproj
          --results-directory "${{ github.workspace }}/TestResults"
          --logger "trx;LogFileName=dns-parser-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-parser-test-results
          path: TestResults/**
          retention-days: 30
          if-no-files-found: error

      - name: Summarise results
        if: always()
        shell: bash
        run: |
          # Guard each pipeline with || true: the step runs with -e -o pipefail,
          # and find (no TestResults) or grep (no match) would otherwise abort it
          # before the fallback and the default values can apply.
          trx="$(find TestResults -name '*.trx' 2>/dev/null | head -1 || true)"
          if [ -z "$trx" ]; then
            echo "No TRX file was produced (the build or test step did not run)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          counters="$(grep -o '<Counters[^>]*/>' "$trx" | head -1 || true)"
          field() {
            local name="$1"
            echo "$counters" | grep -o "$name=\"[0-9]*\"" | grep -o '[0-9]*' | head -1 || true
          }
          total="$(field total)";   total="${total:-0}"
          passed="$(field passed)"; passed="${passed:-0}"
          failed="$(field failed)"; failed="${failed:-0}"
          # total - passed counts every non-passing outcome (failed, error, timeout,
          # aborted, inconclusive), so a host error or timeout is not shown as a pass.
          notpassed=$(( total - passed ))
          {
            echo "### DNS parser tests"
            echo ""
            echo "| Total | Passed | Failed | Not passed |"
            echo "|------:|-------:|-------:|-----------:|"
            echo "| ${total} | ${passed} | ${failed} | ${notpassed} |"
            echo ""
            echo "_Not passed = total − passed, covering failures, errors, timeouts and aborts._"
          } >> "$GITHUB_STEP_SUMMARY"
