name: DNS parser coverage-guided fuzzing

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duration per target (1–240 minutes)"
        type: number
        required: true
        default: 30
  schedule:
    - cron: "17 2 * * 1-6"
    - cron: "23 2 * * 0"
  pull_request:
    paths:
      - "fuzzing/coverage/**"
      - "TechnitiumLibrary.Net/Dns/**"
      - ".github/workflows/fuzz-coverage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || (github.event_name == 'schedule' && 160) || 270 }}
    env:
      CAMPAIGN_MINUTES: ${{ github.event_name == 'pull_request' && '3' || (github.event_name == 'schedule' && (github.event.schedule == '23 2 * * 0' && '120' || '30')) || format('{0}', inputs.duration_minutes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test corpus generator
        run: python3 -m unittest discover -s fuzzing/coverage/tests -v

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Build coverage-guided harness
        run: dotnet publish fuzzing/coverage/DnsParserFuzz/DnsParserFuzz.csproj -c Release -o "${RUNNER_TEMP}/parser-fuzz"

      - name: Test DNS parser fuzzing oracle
        run: dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll" --test-oracle

      - name: Assert bounded mutation input handling
        run: dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll" --test-resource-bounds

      - name: Generate seed corpus and replay on uninstrumented parser
        run: |
          python3 fuzzing/coverage/generate_seeds.py --output "${RUNNER_TEMP}/parser-seeds"
          python3 fuzzing/coverage/generate_structured_seeds.py --output "${RUNNER_TEMP}/parser-seeds"
          for seed in "${RUNNER_TEMP}"/parser-seeds/*; do
            dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll" --replay "$seed"
          done

      - name: Validate semantic oracle on reviewed DNS corpus
        run: dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll" --verify-seeds "${RUNNER_TEMP}/parser-seeds"

      - name: Verify content-addressed regression corpus
        run: python3 fuzzing/coverage/corpus.py verify --directory fuzzing/coverage/regressions

      - name: Replay reviewed regression corpus
        run: |
          for sample in fuzzing/coverage/regressions/*.bin; do
            [ -f "$sample" ] || continue
            dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll" --replay "$sample"
          done

      - name: Install independent DNS parser (binary wheel)
        run: |
          python3 -m venv "${RUNNER_TEMP}/dns-venv"
          "${RUNNER_TEMP}/dns-venv/bin/python" -m pip install --only-binary=:all: 'dnspython==2.8.0'

      - name: Test differential comparator
        run: "${RUNNER_TEMP}/dns-venv/bin/python -m unittest discover -s fuzzing/coverage/differential_tests -v"

      - name: Differential comparison against dnspython
        run: |
          "${RUNNER_TEMP}/dns-venv/bin/python" fuzzing/coverage/differential.py --seeds "${RUNNER_TEMP}/parser-seeds" --output "${RUNNER_TEMP}/differential.json" --max-cases 100 -- dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll"

      - name: Benchmark clean parser overhead (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 fuzzing/coverage/benchmark_modes.py --target datagram --input "${RUNNER_TEMP}/parser-seeds/query-a" --output "${RUNNER_TEMP}/benchmark-modes.json" -- dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll"

      - name: Restore successful prior corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORPUS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 fuzzing/coverage/restore_corpus.py --repository "${{ github.repository }}" --branch "${CORPUS_BRANCH}" --workflow fuzz-coverage.yml --target datagram --output "${RUNNER_TEMP}/parser-seeds" --limit 150

      - name: Preserve uninstrumented harness for crash replay
        run: cp -a "${RUNNER_TEMP}/parser-fuzz" "${RUNNER_TEMP}/parser-clean"

      - name: Install AFL++ and SharpFuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++
          dotnet tool install --global SharpFuzz.CommandLine --version 2.3.0

      - name: Instrument managed parser
        run: "${HOME}/.dotnet/tools/sharpfuzz \"${RUNNER_TEMP}/parser-fuzz/TechnitiumLibrary.Net.dll\""

      - name: Validate campaign duration
        run: |
          case "${CAMPAIGN_MINUTES}" in
            ''|*[!0-9]*) echo "Duration must be a positive integer"; exit 2 ;;
            *) ;;
          esac
          if [ "${CAMPAIGN_MINUTES}" -lt 1 ] || [ "${CAMPAIGN_MINUTES}" -gt 240 ]; then
            echo "Duration outside 1–240-minute campaign range"
            exit 2
          fi
          echo "Campaign duration: ${CAMPAIGN_MINUTES} minutes"

      - name: Coverage-guided AFL++ campaign
        env:
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_SKIP_BIN_CHECK: "1"
        run: |
          afl-fuzz -V "$((CAMPAIGN_MINUTES * 60))" -i "${RUNNER_TEMP}/parser-seeds" \
            -o "${RUNNER_TEMP}/parser-findings" -m none -t 5000+ -- \
            dotnet "${RUNNER_TEMP}/parser-fuzz/DnsParserFuzz.dll"

      - name: Write campaign metrics
        if: always()
        run: |
          python3 fuzzing/coverage/campaign_metrics.py --findings "${RUNNER_TEMP}/parser-findings" --target datagram --minutes "${CAMPAIGN_MINUTES}" --output "${RUNNER_TEMP}/parser-findings/campaign-metrics.json"

      # AFL++ queue entries are coverage-discovered. This snapshot removes
      # byte-identical duplicates only; it makes no coverage-minimization claim.
      - name: Snapshot discovered corpus
        if: always()
        run: |
          python3 fuzzing/coverage/corpus.py snapshot --seeds "${RUNNER_TEMP}/parser-seeds" --queue "${RUNNER_TEMP}/parser-findings/default/queue" --destination "${RUNNER_TEMP}/parser-snapshot"

      - name: Upload corpus snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-datagram-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/parser-snapshot/
          if-no-files-found: warn
          retention-days: 30

      - name: Triage AFL++ findings using clean parser
        if: always()
        run: |
          ulimit -c 0
          if [ -f "${RUNNER_TEMP}/parser-clean/DnsParserFuzz.dll" ]; then
            dotnet --info > "${RUNNER_TEMP}/fuzz-environment.txt"
            uname -a >> "${RUNNER_TEMP}/fuzz-environment.txt"
            git rev-parse HEAD >> "${RUNNER_TEMP}/fuzz-environment.txt"
            (cd "${RUNNER_TEMP}/parser-clean" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) >> "${RUNNER_TEMP}/fuzz-environment.txt"
            python3 fuzzing/coverage/triage.py --findings "${RUNNER_TEMP}/parser-findings" --output "${RUNNER_TEMP}/parser-findings/triage" --timeout 5 --environment-file "${RUNNER_TEMP}/fuzz-environment.txt" -- dotnet "${RUNNER_TEMP}/parser-clean/DnsParserFuzz.dll"
          fi

      - name: Include benchmark evidence in AFL++ artifact
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/benchmark-modes.json" ] && [ -d "${RUNNER_TEMP}/parser-findings" ]; then
            mkdir -p "${RUNNER_TEMP}/parser-findings/triage"
            cp "${RUNNER_TEMP}/benchmark-modes.json" "${RUNNER_TEMP}/parser-findings/triage/benchmark-modes.json"
          fi

      - name: Include differential evidence in AFL++ artifact
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/differential.json" ] && [ -d "${RUNNER_TEMP}/parser-findings" ]; then
            mkdir -p "${RUNNER_TEMP}/parser-findings/triage"
            cp "${RUNNER_TEMP}/differential.json" "${RUNNER_TEMP}/parser-findings/triage/differential.json"
          fi

      # AFL filenames use colons, which upload-artifact rejects. Tar preserves
      # the exact bytes/names for downstream triage.
      - name: Package AFL++ evidence
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/parser-findings" ]; then
            tar -czf "${RUNNER_TEMP}/parser-afl-results.tar.gz" -C "${RUNNER_TEMP}/parser-findings" .
          fi

      - name: Upload AFL++ evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-parser-afl-${{ github.run_id }}
          path: ${{ runner.temp }}/parser-afl-results.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on saved parser crashes
        run: |
          crash_count="$(find "${RUNNER_TEMP}/parser-findings/default/crashes" -type f -name 'id:*' | wc -l)"
          echo "AFL++ saved ${crash_count} crash candidates."
          test "${crash_count}" -eq 0
